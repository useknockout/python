[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "useknockout"
version = "0.0.4"
description = "Python SDK for useknockout — state-of-the-art background removal API."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "useknockout" }]
keywords = [
    "background-removal",
    "remove-background",
    "birefnet",
    "ai",
    "image-processing",
    "useknockout",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6.0",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://useknockout.com"
Documentation = "https://github.com/useknockout/python"
Repository = "https://github.com/useknockout/python"
Issues = "https://github.com/useknockout/python/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/useknockout"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
